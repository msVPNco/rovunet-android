name: APK Build

on:
  push:
    branches: ['**']
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      build_android:
        description: "Build native Android APKs (requires original submodules and signing setup)"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  OPENSSL_VERSION: "3.0.15"

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      KOTLIN_JARS: ${{ github.workspace }}/../ci/kotlin
      XRAY: ${{ github.workspace }}/../ci/xray
      CORE_LAUNCHER: ${{ github.workspace }}/../ci/core-launcher
      TLS_TARGET: ${{ github.workspace }}/../ci/tls-target
      TEST_TLS_STORE: ${{ github.workspace }}/../ci/probe.p12
      ROVUNET_PANEL_TEXT_FIXTURE: ${{ github.workspace }}/../ci/panel-text.txt
      ROVUNET_ANDROID_FIXTURE: ${{ github.workspace }}/../ci/panel-fixture.txt
      CORE_TEST_JAR: ${{ github.workspace }}/../ci/tests.jar
    steps:
      - uses: actions/checkout@v4
      - name: Verify device-result gate
        run: python3 tools/veyra/check-device-gate.py
      - name: Reject new unsafe Kotlin constructs
        run: python3 tools/quality/check-kotlin-safety.py
      - name: Native packet shutdown and cancellation regressions
        run: |
          make -C app/src/main/cpp/hev-socks5-tunnel-src -j2 bin/libhev-socks5-tunnel.so
          python3 tools/native/check-hev-cancellation.py
          python3 tools/native/test-hev-stop.py
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Read versioned manager revision
        id: manager-ref
        run: |
          ref=$(cat tools/veyra/MANAGER_REF)
          [[ "$ref" =~ ^[0-9a-f]{40}$ ]]
          echo "value=$ref" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/../ci/kotlin
          key: kotlin-${{ runner.os }}-${{ hashFiles('tools/veyra/jars.sha256') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: xray-${{ runner.os }}-${{ hashFiles('tools/veyra/prepare-jvm-ci.sh') }}
      - uses: actions/checkout@v4
        with:
          repository: msVPNco/rovunet-panel
          ref: ${{ steps.manager-ref.outputs.value }}
          path: panel-contract
          # Needed while rovunet-panel is private: a fine-grained token with
          # read access to it, stored as the PANEL_REPO_TOKEN secret.
          token: ${{ secrets.PANEL_REPO_TOKEN || github.token }}
      - name: Prepare pinned core and JVM tooling
        run: tools/veyra/prepare-jvm-ci.sh
      - name: Generate actual Go exporter fixture and validate coreplan
        working-directory: panel-contract
        run: go test ./internal/clientcfg ./internal/coreplan ./internal/handlers -count=1
      - name: JVM, TLS, lifecycle and contract tests
        run: tools/veyra/run-jvm-tests.sh
      - name: Loopback integration
        run: |
          python3 -m pip install cryptography==46.0.3
          python3 tools/veyra/integration.py
          ROVUNET_AWG_HOST="$(dirname "$XRAY")/awg" ROVUNET_REQUIRE_KOTLIN=true python3 tools/native/build-awg.py

  android-device:
    uses: ./.github/workflows/android-device.yml

  build:
    needs: [verify, android-device]
    if: github.event_name == 'workflow_dispatch' && inputs.build_android
    env:
      ROVUNET_RELEASE_CERT_SHA256: ${{ vars.ROVUNET_RELEASE_CERT_SHA256 }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'jetbrains'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The default also installs the legacy "tools" package, which
          # current sdkmanager no longer finds
          packages: 'platform-tools'

      - name: Install Android NDK
        run: |
          sdkmanager --install "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Cache Rust/Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo
            ~/.rustup
            app/src/main/rust/slipstream-rust/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Cache OpenSSL
        id: cache-openssl
        uses: actions/cache@v4
        with:
          path: ~/android-openssl
          key: openssl-android-${{ env.OPENSSL_VERSION }}

      - name: Build OpenSSL for Android
        if: steps.cache-openssl.outputs.cache-hit != 'true'
        run: |
          chmod +x app/scripts/build-openssl-android.sh
          OUTPUT_DIR=$HOME/android-openssl/android-ssl \
          OPENSSL_VERSION=${{ env.OPENSSL_VERSION }} \
          ./app/scripts/build-openssl-android.sh

      - name: Verify OpenSSL installation
        run: |
          for abi in arm64-v8a armeabi-v7a x86_64; do
            for lib in libssl.a libcrypto.a; do
              test -f ~/android-openssl/android-ssl/$abi/lib/$lib || { echo "Missing $abi/lib/$lib"; exit 1; }
            done
          done
          echo "OpenSSL verification passed"

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: gomobile-build/go.mod
          cache-dependency-path: gomobile-build/go.sum

      - name: Install gomobile
        working-directory: gomobile-build
        run: |
          mobile_version=$(go list -m -f '{{.Version}}' golang.org/x/mobile)
          [[ "$mobile_version" =~ ^v[0-9][A-Za-z0-9.+-]*$ ]]
          go install "golang.org/x/mobile/cmd/gomobile@$mobile_version"
          gomobile init

      - name: Build Go mobile libraries
        working-directory: gomobile-build
        run: make build

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > slipnet-release.keystore
            echo "KEYSTORE_DECODED=true" >> $GITHUB_ENV
          fi

      - name: Create keystore.properties
        if: env.KEYSTORE_DECODED == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cat > keystore.properties <<EOF
          storeFile=../slipnet-release.keystore
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Strip leading whitespace from heredoc indentation
          sed -i 's/^[[:space:]]*//' keystore.properties

      - name: Set up Android SDK path for the prebuilt-native build
        run: printf 'sdk.dir=%s\n' "$ANDROID_HOME" > local.properties

      - name: Prepare verified Full native engines
        run: python3 tools/veyra/prepare-native.py

      - name: Build Full Release APK
        run: ./gradlew assembleFullRelease -PveyraPrebuiltNative=true --no-daemon

      - name: Run standard Android JVM unit tests
        run: ./gradlew :app:testFullDebugUnitTest -PveyraPrebuiltNative=true --no-daemon

      - name: Build Lite Release APK
        run: ./gradlew assembleLiteRelease -PveyraPrebuiltNative=true --no-daemon

      - name: Collect release APKs
        run: |
          mkdir -p release-apks
          cp app/build/outputs/apk/full/release/*.apk release-apks/ 2>/dev/null || true
          cp app/build/outputs/apk/lite/release/*.apk release-apks/ 2>/dev/null || true

      - name: Verify shipped 64-bit ELF alignment
        run: python3 tools/quality/check-apk-native.py release-apks/*.apk

      - name: Upload Release APKs
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: release-apks/*.apk
          retention-days: 5
