name: Publish owner-approved alpha16

# One-version owner authorization, recorded in docs/releases/alpha16-provenance.json.
# Branch creation is explicit after acceptance and merge. Pushes/PRs do not publish.
on: create

permissions:
  contents: read

concurrency:
  group: owner-approved-alpha16-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'msVPNco/rovunet-app' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'publish/alpha16-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact approved publication revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Restore approved APK, verify assets and publish Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/publish_approved_alpha16.py \
            --ci-zip "$RUNNER_TEMP/alpha16-ci.zip" \
            --previous-source "$RUNNER_TEMP/alpha15.4-source.zip" \
            --output "$RUNNER_TEMP/alpha16-publication" \
            --publish
