name: Publish owner-approved Android alpha17

# One-version owner authorization; never build or re-sign the accepted APK.
on: create

permissions:
  contents: read

concurrency:
  group: owner-approved-alpha17-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'msVPNco/rovunet-app' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'publish/alpha17-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - name: Check out exact approved publication revision
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Restore approved APK, verify draft assets and publish Latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/publish_approved_alpha17.py \
            --ci-zip "$RUNNER_TEMP/alpha17-ci.zip" \
            --previous-source "$RUNNER_TEMP/alpha15.4-source.zip" \
            --output "$RUNNER_TEMP/alpha17-publication" \
            --publish
