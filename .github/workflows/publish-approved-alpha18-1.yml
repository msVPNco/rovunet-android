name: Publish authorized Android alpha18.1

# One-version owner authorization. Restore the pinned APK; no signing key in CI.
on: create

permissions:
  contents: read

concurrency:
  group: authorized-alpha18-1-publication
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'msVPNco/rovunet-app' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'publish/alpha18-1-approved')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read
      pull-requests: read
    steps:
      - name: Check out exact authorized publication revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: false
          persist-credentials: false
      - name: Verify APK and sources and publish verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/release/publish_approved_alpha18_1.py \
            --ci-zip "$RUNNER_TEMP/alpha18-1-ci.zip" \
            --previous-source "$RUNNER_TEMP/alpha15.4-source.zip" \
            --output "$RUNNER_TEMP/alpha18-1-publication" \
            --publish
