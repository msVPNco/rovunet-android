name: Android device regressions

on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read

jobs:
  vpn-device:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    env:
      ANDROID_SERIAL: emulator-5554
      GOTOOLCHAIN: auto
      IMAGE: 'system-images;android-30;google_apis;x86_64'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up build tools and device image
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          echo "ANDROID_USER_HOME=$RUNNER_TEMP/rovunet-android" >> "$GITHUB_ENV"
          echo "ANDROID_AVD_HOME=$RUNNER_TEMP/rovunet-android/avd" >> "$GITHUB_ENV"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platform-tools' 'platforms;android-36' 'build-tools;35.0.0' 'build-tools;36.0.0' 'ndk;29.0.14206865' emulator "$IMAGE"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: slipstream-cargo-${{ runner.os }}-${{ hashFiles('tools/native/slipstream-android.patch') }}
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/verified-inputs
            ~/.gradle/verified-maven
          key: gradle-verified-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', 'tools/veyra/prepare-gradle.py') }}
      - name: Prepare checksum-verified Gradle
        run: python3 tools/veyra/prepare-gradle.py
      - name: Compile Kotlin against verified bindings before native rebuild
        run: |
          python3 tools/veyra/prepare-native.py --bindings-only
          bash gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --max-workers=2 :app:compileFullDebugKotlin -ProvunetVerifiedBuildInputs=true -PveyraPrebuiltNative=true -ProvunetDeviceCandidate=true --stacktrace
      - name: Build private client and device tests
        run: |
          python3 tools/veyra/prepare-native.py
          df -h "$GITHUB_WORKSPACE"
          free -h
          bash gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --max-workers=2 :app:testFullDebugUnitTest :app:assembleFullDebug :app:assembleFullDebugAndroidTest -ProvunetVerifiedBuildInputs=true -PveyraPrebuiltNative=true -ProvunetDeviceCandidate=true --stacktrace
          bash gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --max-workers=2 :app:assembleFullRelease :app:assembleFullReleaseAndroidTest -ProvunetVerifiedBuildInputs=true -PveyraPrebuiltNative=true -ProvunetDeviceCandidate=true -ProvunetMinifiedBindingTests=true --stacktrace
          cp app/build/outputs/apk/full/release/*-full-release-universal.apk "$RUNNER_TEMP/Rovunet-minified-private.apk"
      - name: Verify instrumented VPN and scanner behaviour
        run: |
          test -c /dev/kvm
          sudo chgrp "$(id -gn)" /dev/kvm
          sudo chmod g+rw /dev/kvm
          mkdir -p "$ANDROID_USER_HOME" "$ANDROID_AVD_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name rovunet-ci --path "$ANDROID_AVD_HOME/rovunet-ci.avd" --package "$IMAGE" --device pixel <<< no
          test -s "$ANDROID_AVD_HOME/rovunet-ci.ini"
          "$ANDROID_HOME/emulator/emulator" -list-avds | grep -Fx rovunet-ci
          "$ANDROID_HOME/emulator/emulator" -avd rovunet-ci -accel on -port 5554 -no-window -no-audio -no-snapshot -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          emulator_pid=$!
          trap 'device_exit=$?; if [[ "$device_exit" != 0 ]]; then adb -s "$ANDROID_SERIAL" logcat -d -b crash > "$RUNNER_TEMP/minified-device-crash.log" 2>&1; tail -160 "$RUNNER_TEMP/minified-device-crash.log"; fi; kill "$emulator_pid" 2>/dev/null || true; exit "$device_exit"' EXIT
          timeout 360 bash -c 'until [[ $(adb -s "$ANDROID_SERIAL" shell getprop sys.boot_completed 2>/dev/null | tr -d "\r") == 1 ]]; do sleep 2; done' || { tail -60 "$RUNNER_TEMP/emulator.log"; exit 1; }
          adb -s "$ANDROID_SERIAL" shell wm dismiss-keyguard
          python3 tools/veyra/run-device-gate.py
      - name: Prepare the verified public APK for offline signing
        run: |
          bash gradlew -Dorg.gradle.jvmargs="-Xmx6g -Dfile.encoding=UTF-8" --max-workers=2 :app:assembleFullRelease -ProvunetVerifiedBuildInputs=true -PveyraPrebuiltNative=true -ProvunetDeviceCandidate=false -ProvunetUnsignedPublication=true --stacktrace
          python3 tools/quality/check-gomobile-apk.py app/build/outputs/apk/full/release/*-full-release-universal-unsigned.apk
          python3 tools/quality/check-slipstream-apk.py app/build/outputs/apk/full/release/*-full-release-universal-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" "$RUNNER_TEMP/rovunet-apksigner.jar"
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging app/build/outputs/apk/full/release/*-full-release-universal-unsigned.apk > "$RUNNER_TEMP/rovunet-code42-apk-badging.txt"
      - name: Retain verified minified APKs
        if: always() && !cancelled()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rovunet-code42-review-validation
          path: |
            ${{ runner.temp }}/Rovunet-minified-private.apk
            app/build/outputs/apk/full/release/*-full-release-universal-unsigned.apk
            app/build/outputs/apk/androidTest/full/debug/*-androidTest.apk
            app/build/outputs/apk/androidTest/full/release/*-androidTest.apk
            app/build/outputs/mapping/fullRelease/mapping.txt
            app/schemas/app.slipnet.data.local.database.SlipNetDatabase/50.json
            tools/veyra/device-results/*.png
            ${{ runner.temp }}/minified-device-crash.log
            ${{ runner.temp }}/rovunet-apksigner.jar
            ${{ runner.temp }}/rovunet-code42-apk-badging.txt
          if-no-files-found: error
          retention-days: 5
